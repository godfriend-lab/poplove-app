<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="POPLOVE - Application de rencontre géolocalisée en Afrique" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>POPLOVE - Rencontres géolocalisées</title>
    
    <!-- Polices Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" 
      rel="stylesheet" 
    />

    <!-- Styles de base -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
        color: white;
        min-height: 100vh;
        overflow-x: hidden;
      }

      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, #ff6b9d, #e63946);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(135deg, #e63946, #c44569);
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader-heart {
        font-size: 4rem;
        animation: heartbeat 1.5s ease-in-out infinite;
      }

      .loader-text {
        margin-top: 20px;
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #ff6b9d, #e63946);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 3px;
      }

      @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        25% { transform: scale(1.1); }
        50% { transform: scale(1); }
        75% { transform: scale(1.1); }
      }
    </style>
  </head>
  <body>
    <!-- Écran de chargement -->
    <div id="loading-screen">
      <div class="loader-heart">💕</div>
      <div class="loader-text">POPLOVE</div>
    </div>

    <!-- Application React -->
    <div id="root"></div>

    <!-- Script principal Vite/React -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- SDK KKiaPay - Version 1 -->
    <script src="https://kkiapay.me/k.js"></script>
    
    <!-- SDK KKiaPay - Version 2 (fallback) -->
    <script src="https://cdn.kkiapay.me/k.js"></script>

    <!-- Script pour masquer le loader -->
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('loading-screen');
        setTimeout(() => {
          loader.classList.add('fade-out');
          setTimeout(() => {
            loader.style.display = 'none';
          }, 500);
        }, 800);
      });

      // Vérifier que KKiaPay est chargé
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (typeof window.kkiapay === 'function') {
            console.log('✅ KKiaPay SDK chargé avec succès');
          } else {
            console.warn('⚠️ KKiaPay SDK non chargé. Tentative de chargement alternatif...');
            
            // Charger dynamiquement si pas disponible
            const script = document.createElement('script');
            script.src = 'https://kkiapay.me/k.js';
            script.onload = () => {
              console.log('✅ KKiaPay SDK chargé dynamiquement');
            };
            script.onerror = () => {
              console.error('❌ Impossible de charger KKiaPay SDK');
            };
            document.body.appendChild(script);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
